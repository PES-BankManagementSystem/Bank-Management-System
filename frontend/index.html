<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Management System | Deposit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Bank Management System</p>
    <h1>Deposit money</h1>
    <p class="intro">Record a cash deposit to an active customer account.</p>

    <form id="deposit-form">
      <label for="account-number">Account number</label>
      <input id="account-number" name="account_number" type="text" autocomplete="off" required>

      <label for="amount">Amount</label>
      <div class="amount-input">
        <span aria-hidden="true">₹</span>
        <input id="amount" name="amount" type="text" inputmode="decimal"
               pattern="[0-9]+(\.[0-9]{1,2})?" placeholder="0.00" required>
      </div>
      <p class="hint">Use rupees with up to two decimal places.</p>

      <button id="submit-button" type="submit">Review deposit</button>
    </form>
    <p id="result" class="result" role="status" aria-live="polite"></p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
