name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: ./scripts/check-secrets.sh

  portability:
    name: No platform-specific business logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check business modules
        run: ./scripts/check-portability.sh

  backend:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # NFR-9: the C/C++ core must build and run on Linux and Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  coverage:
    name: Code and branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr==8.8

      - name: Build, test and measure coverage
        run: ./scripts/coverage.sh

      - name: Add coverage to the job summary
        run: cat build-coverage/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/coverage/
          if-no-files-found: error
